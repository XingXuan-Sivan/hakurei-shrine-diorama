<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b1a1d" />
    <title>博丽神社 · 幻想乡的一隅</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas id="backdrop" aria-hidden="true"></canvas>
    <div id="stage" aria-hidden="true"></div>

    <header class="hud">

        <button type="button" data-mode="day" aria-pressed="false">白昼</button>
        <button type="button" data-mode="night" aria-pressed="false">夜晚</button>
      </div>
    </header>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
