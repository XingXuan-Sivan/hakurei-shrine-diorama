<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b1a1d" />
    <title>博丽神社 · 幻想乡的一隅</title>
    <link rel="stylesheet" href="./styles.css" />
    <!-- The bundle takes a while to parse on a phone, and textures were only
         requested once it ran. Fetching them from the HTML lets the downloads
         overlap that work instead of queueing behind it. The character sheet is
         the heaviest and gates Reimu, so it goes first. -->
    <link rel="preload" as="image" href="./assets/reimu-atlas.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="./assets/reimu-shadow-atlas.webp" />
    <link rel="preload" as="image" href="./assets/gravel.webp" />
    <link rel="preload" as="image" href="./assets/roof-tile.webp" />
    <link rel="preload" as="image" href="./assets/stone.webp" />
    <link rel="preload" as="image" href="./assets/plaster.webp" />
    <link rel="preload" as="image" href="./assets/wood.webp" />
    <link rel="preload" as="image" href="./assets/paper.webp" />
    <link rel="preload" as="image" href="./assets/soft-shadow.webp" />
    <link rel="preload" as="image" href="./assets/glow.webp" />
  </head>
  <body>
    <canvas id="backdrop" aria-hidden="true"></canvas>
    <div id="stage" aria-hidden="true"></div>

    <header class="hud">
      <h1 class="title">博麗神社 <i>·</i> <span id="phase-name">昼</span></h1>
      <div class="clock" role="group" aria-label="时间">
        <button
          id="clock-auto"
          class="clock-auto"
          type="button"
          aria-pressed="false"
          aria-label="时间自动流转，点击锁定当前时刻"
        >
          自动
        </button>
        <div class="clock-dial">
          <span class="clock-arc" aria-hidden="true"></span>
          <span class="clock-ticks" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span id="clock-thumb" class="clock-thumb" aria-hidden="true"></span>
          <input
            id="clock-range"
            class="clock-range"
            type="range"
            min="0"
            max="1000"
            step="1"
            value="140"
            aria-label="时间（拖动切换昼夜）"
            aria-valuetext="06:00"
          />
        </div>
        <span id="clock-time" class="clock-time">06:00</span>
      </div>
    </header>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
